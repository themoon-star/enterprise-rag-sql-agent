[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustquery-agent"
version = "0.1.0"
description = "Clean-room enterprise RAG and secure Text-to-SQL agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "cryptography>=45.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.10.0",
  "pyjwt>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "sqlglot>=27.0.0",
  "uvicorn[standard]>=0.35.0",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
markers = [
  "integration: requires a real PostgreSQL service",
  "evaluation: runs a fixed acceptance dataset",
]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S105", "S106"]

[dependency-groups]
dev = [
  "httpx2>=2.12.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]
